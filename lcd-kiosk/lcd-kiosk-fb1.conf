# Minimal Xorg config for the LCD kiosk: render to the SPI framebuffer with the
# fbdev driver (the device is selected at runtime via the FRAMEBUFFER env var set
# by lcd-kiosk-start, since the panel's /dev/fbN number is not stable), and take
# touch from the evdev driver so the calibration below applies. Referenced
# explicitly by lcd-kiosk-start (never auto-loaded).
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier "LCD-fbdev"
    Driver     "fbdev"
    # No explicit "fbdev" option on purpose: the device comes from the
    # FRAMEBUFFER env var that lcd-kiosk-start exports after locating the panel
    # by name. Hard-coding /dev/fbN here would break when the number shifts.
EndSection

Section "Monitor"
    Identifier "LCD-monitor"
EndSection

Section "Screen"
    Identifier "LCD-screen"
    Device     "LCD-fbdev"
    Monitor    "LCD-monitor"
EndSection

Section "ServerLayout"
    Identifier "LCD-layout"
    Screen     "LCD-screen"
EndSection

Section "InputClass"
    Identifier  "LCD-touch"
    MatchProduct "ADS7846 Touchscreen"
    MatchDevicePath "/dev/input/event*"
    Driver      "evdev"
    # Touch calibration for a tft35a:rotate=90 panel (axes swapped; vertical
    # raw ABS_X 285..3800 -> screen Y; horizontal raw ABS_Y 3593..190 -> screen
    # X, inverted). Calibration is per-panel. To recalibrate the reliable way on
    # a noisy resistive panel: stop the kiosk, run
    #   sudo evtest /dev/input/event2 | grep --line-buffered -E 'ABS_X|ABS_Y'
    # drag the stylus edge-to-edge, read each axis's raw min/max, then set
    # Calibration "<topX> <bottomX> <leftY> <rightY>". (xinput_calibrator also
    # works but its taps are easily corrupted by touch-down noise.)
    Option      "Calibration" "285 3800 3593 190"
    Option      "SwapAxes" "1"
    Option      "GrabDevice" "false"
EndSection
