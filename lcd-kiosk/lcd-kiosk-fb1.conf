# Minimal Xorg config for the LCD kiosk: render to the SPI framebuffer with the
# fbdev driver (the device is selected at runtime via the FRAMEBUFFER env var set
# by lcd-kiosk-start, since the panel's /dev/fbN number is not stable), and take
# touch from the evdev driver so the calibration below applies. Referenced
# explicitly by lcd-kiosk-start (never auto-loaded).
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier "LCD-fbdev"
    Driver     "fbdev"
    # No explicit "fbdev" option on purpose: the device comes from the
    # FRAMEBUFFER env var that lcd-kiosk-start exports after locating the panel
    # by name. Hard-coding /dev/fbN here would break when the number shifts.
EndSection

Section "Monitor"
    Identifier "LCD-monitor"
EndSection

Section "Screen"
    Identifier "LCD-screen"
    Device     "LCD-fbdev"
    Monitor    "LCD-monitor"
EndSection

Section "ServerLayout"
    Identifier "LCD-layout"
    Screen     "LCD-screen"
EndSection

Section "InputClass"
    Identifier  "LCD-touch"
    MatchProduct "ADS7846 Touchscreen"
    MatchDevicePath "/dev/input/event*"
    Driver      "evdev"
    # Touch calibration for a tft35a:rotate=90 panel, tuned on real hardware.
    # The panel is linear; measured raw edges were vertical ABS_X ~285..3800 and
    # horizontal ABS_Y ~3593..190. The values below invert both axes to match the
    # display orientation and add a small offset correction. Calibration is
    # per-panel; to redo it: stop the kiosk and run
    #   sudo evtest /dev/input/event2 | grep --line-buffered -E 'ABS_X|ABS_Y'
    # drag the stylus edge-to-edge to read each axis's raw min/max, set
    # Calibration "minx maxx miny maxy" (first pair = vertical, second = horizontal;
    # swap a pair to flip that axis), then nudge both numbers of a pair together to
    # remove any constant offset (~7 raw units per pixel).
    Option      "Calibration" "3700 185 290 3693"
    Option      "SwapAxes" "1"
    Option      "GrabDevice" "false"
EndSection
